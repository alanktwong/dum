name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC

jobs:
  setup:
    uses: ./.github/workflows/common.yml

  test:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
      - run: go mod download
      - run: mise run generate
      - run: mise run build
      - run: go test -coverprofile=dist/cover.out -covermode=atomic ./...
      - uses: vladopajic/go-test-coverage@v2
        if: runner.os == 'Linux'
        with:
          profile: dist/cover.out
          config: ./cfg/testcoverage.yml
          github-action-output: true
