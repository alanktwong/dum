name: Common Setup

on:
  workflow_call:
    inputs:
      cache:
        type: boolean
        default: true

jobs:
  setup:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
        with:
          cache: ${{ inputs.cache }}
      - run: go mod download
