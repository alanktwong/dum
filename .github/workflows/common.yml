name: Common Setup

on:
  workflow_call:
    inputs:
      go-version:
        type: string
        default: '1.26'

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
      - run: go mod download
      - run: make ci-setup
