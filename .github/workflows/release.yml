name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  setup:
    uses: ./.github/workflows/common.yml
    with:
      go-version: '1.26'

  release:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean -f cfg/goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
