all: false
dir: '{{.InterfaceDir}}'
filename: mocks_test.go
force-file-write: true
formatter: goimports
include-auto-generated: false
log-level: info
structname: '{{.Mock}}{{.InterfaceName}}'
pkgname: '{{.SrcPackageName}}'
recursive: false
require-template-schema-exists: true
template: testify
template-schema: '{{.Template}}.schema.json'
packages:
  awong/dotfiles/pkg/external:
    config:
      all: true
      dir: 'pkg/playbook'
      pkgname: 'playbook'
      filename: "external_mocks.go"
  awong/dotfiles/pkg/logging:
    config:
      all: true
      dir: 'pkg/tasks/installer'
      pkgname: 'installer'
      filename: "logging_mocks.go"
  awong/dotfiles/pkg/external/Brew:
    config:
      dir: 'pkg/tasks/installer'
      pkgname: 'installer'
      filename: "brew_mocks.go"
  awong/dotfiles/pkg/external/Ext:
    config:
      dir: 'pkg/tasks/installer'
      pkgname: 'installer'
      filename: "ext_mocks.go"