all: false
dir: '{{.InterfaceDir}}'
filename: mocks.go
force-file-write: true
formatter: goimports
include-auto-generated: false
log-level: info
structname: '{{.Mock}}{{.InterfaceName}}'
pkgname: '{{.SrcPackageName}}'
recursive: false
require-template-schema-exists: true
template: testify
template-schema: '{{.Template}}.schema.json'
packages:
  awong/dotfiles/pkg/external:
    config:
      all: false
      dir: 'pkg/playbook'
      pkgname: 'playbook'
      filename: "external_mocks.go"
    interfaces:
      Brew: {}
      Code: {}
      Ext: {}
      Runner: {}
  awong/dotfiles/pkg/logging:
    config:
      all: true
      dir: 'pkg/tasks/installer'
      pkgname: 'installer'
      filename: "logging_mocks.go"
  awong/dotfiles/pkg/plays:
    config:
      all: false
      dir: 'pkg/plays'
      pkgname: 'plays'
      filename: "playbook_info_mocks_test.go"
    interfaces:
      PlayBookInfo: {}
