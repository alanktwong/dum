playbook:
  id: "my-test-playbook"
  description: "My test playbook"
  enabled: true
  jetbrains:
    - datagrip: "DataGrip2025.1"
    - goland: "GoLand2025.1"
    - idea: "IntelliJIdea2025.1"
    - pycharm: "PyCharm2025.1"
    - rustrover: "RustRover2025.1"
    - webstorm: "WebStorm2025.1"
  plays:
    - id: "play-1"
      enabled: true
      description: "Play 1"
      tasks:
        - type: "dir"
          id: "~/.dotfiles"
          description: "mkdir -p for a test"
        - type: "link"
          id: "../projects/dotfiles"
          root: "~/.dotfiles"
          description: "ln -s for a test"
        - type: "bash"
          id: "test-echo"
          command: "echo 'hello world'"
          description: "bash command test"
        - type: "bash"
          id: "test-script"
          script: |
            echo 'line 1'
            echo 'line 2'
          description: "bash script test"
        - type: "brew"
          id: "scc"
          description: "Count LOC for a test"
        - type: "cask"
          id: "visual-studio-code"
          description: "brew install --cask for a test"
        - type: "cellar"
          id: "boost"
          description: "Collection of portable C++ source libraries for a test"
        - type: "function"
          id: "install_test"
          description: "call a function for a test"
        - type: "git"
          id: "https://github.com/tmux-plugins/tpm.git"
          description: "git clone for a test"
        - type: "mas"
          id: "462058435"
          description: "mas install Microsoft Excel for a test"
        - type: "vscode"
          id: "vscodevim.vim"
          description: "code --install-extension for a test"
        - type: "jetbrains"
          id: "org.asciidoctor.intellij.asciidoc"
          description: "goland installPlugins for a test"
          apps:
            - "idea"
            - "goland"
    - id: "play-2"
      enabled: false
      description: "Play 2"
      tasks:
        - type: "dir"
          id: "~/.dotfiles"
        - type: "git"
          id: "https://github.com/assertj/assertj.git"
          enabled: false
        - type: "mas"
          id: "462058435"
          description: "Microsoft Excel"
          enabled: false