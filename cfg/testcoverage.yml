profile: dist/cover.out
threshold:
  file: 0
  package: 0
  total: 40

override:
  - path: ^internal/cmd$
    threshold: 7
  - path: ^internal/external$
    threshold: 1
  - path: ^internal/factory$
    threshold: 5
  - path: ^internal/logging$
    threshold: 4
  - path: ^internal/playbook$
    threshold: 3
  - path: ^internal/plays$
    threshold: 4
  - path: ^internal/tasks$
    threshold: 15
  - path: ^internal/tasks/installer$
    threshold: 2
  - path: ^internal/types$
    threshold: 1

exclude:
  paths:
    - \*_enum\.go$
    - \*_mocks\.go$
    - ^internal/.*/gen/
