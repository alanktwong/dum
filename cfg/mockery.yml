all: false
dir: '{{.InterfaceDir}}'
filename: mocks.go
force-file-write: true
formatter: goimports
include-auto-generated: false
log-level: info
structname: '{{.Mock}}{{.InterfaceName}}'
pkgname: '{{.SrcPackageName}}'
recursive: false
require-template-schema-exists: true
template: testify
template-schema: '{{.Template}}.schema.json'
packages:
  alanktwong/dum/internal/external/gen:
    config:
      all: false
      dir: 'internal/external/gen'
      pkgname: 'gen'
      filename: "mocks.go"
    interfaces:
      Brew: {}
      Code: {}
      Ext: {}
      Git: {}
      JetBrainsApp: {}
      Mas: {}
      Runner: {}
  alanktwong/dum/internal/logging:
    config:
      all: true
      dir: 'internal/tasks/installer'
      pkgname: 'installer'
      filename: "logging_mocks.go"
    interfaces:
      Logger: {}
  alanktwong/dum/internal/plays/gen:
    config:
      all: false
      dir: 'internal/plays/gen'
      pkgname: 'gen'
      filename: "playbook_info_mocks.go"
    interfaces:
      PlayBookInfo: {}
