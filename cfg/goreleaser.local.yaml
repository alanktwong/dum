version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: "dum"
    main: "./cmd/dum"
    binary: "{{.ProjectName}}-{{.Os}}-{{.Arch}}-{{.RawVersion}}-{{.ShortCommit}}{{if .IsGitDirty}}-dirty{{end}}"
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - arm64
      - amd64
    hooks:
      pre:
        - cmd: 'test "{{.Os}}" != "windows" && exit 0; echo "ERROR: Windows builds are not supported"; exit 1'
    ldflags:
      - -X main.version={{.RawVersion}}-{{.ShortCommit}}{{if .IsGitDirty}}-dirty{{end}}
      - -X main.commit={{.ShortCommit}}
    no_unique_dist_dir: true

archives:
  - formats: ["binary"]

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"