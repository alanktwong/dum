version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: "dum"
    main: "./cmd/dum/main.go"
    binary: "{{.ProjectName}}-{{.Os}}-{{.Arch}}-{{.RawVersion}}-{{.ShortCommit}}"
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - arm64
    hooks:
      pre:
        - cmd: "test \"{{.Os}}\" != \"windows\" && exit 0; echo \"ERROR: Windows builds are not supported\"; exit 1"
    ldflags:
      - -X awong/dotfiles/internal/cmd.version={{.RawVersion}}-{{.ShortCommit}}
      - -X awong/dotfiles/internal/cmd.commit={{.ShortCommit}}
    no_unique_dist_dir: true

archives:
  - formats: ["tar.gz"]
    name_template: >-
      {{ .ProjectName }}_
      {{- if eq .Os "darwin" }}darwin
      {{- else if eq .Os "linux" }}linux
      {{- else if eq .Os "windows" }}windows
      {{- else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}_
      {{- if .Arm }}v{{ .Arm }}{{ end }}_
      {{- .Version }}-{{ .ShortCommit }}
    format_overrides:
      - goos: windows
        formats: ["zip"]

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).